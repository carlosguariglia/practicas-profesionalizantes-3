async onbtnLoginClick() 
{
    // Aquí se llamaría a la función para loguear al usuario
    const username = prompt("Ingrese su nombre de usuario:");
    const password = prompt("Ingrese su contraseña:");

    // Se calcula el hash SHA-256 de la contraseña antes de enviarla al servidor
    let accesskey = null;
    try {
        accesskey = await this.calcularHashSHA256(password);
    } catch (error) {
        console.error(error);
    }
    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, accesskey })
        });
        if (!response.ok) {
            alert('Login fallido');
            this.currentUser = null;
            return null;
        }
        const data = await response.json().catch(() => null);
        if (!data) return;
        alert('Login exitoso');
        this.currentUser = data.username || username;
        this.welcomeMessage.textContent = `Bienvenido/a, ${this.currentUser}`;
        this.welcomeMessage.style.display = 'block'; // mostrar mensaje de bienvenida
        this.table.style.display = 'table'; // mostrar la tabla con las acciones
    } catch (error) {
        console.error('Error:', error);
        alert('Error en el login');
    }
}

async onbtnLogoutClick() {
    // Aquí se llamaría a la función para desloguear al usuario
    if (!this.currentUser) {
        alert('No hay usuario logueado');
        return;
    }
    try {
        const response = await fetch('/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: this.currentUser })
        });
        if (response.ok) {
            alert('Logout exitoso');
            this.currentUser = null;
            this.welcomeMessage.style.display = 'none'; // ocultar mensaje de bienvenida
            this.table.style.display = 'none'; // ocultar la tabla con las acciones
        } else {
            alert('Logout fallido');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error en el logout');
    }
}

async onbtnupdateUsuarioClick() {

    // Se comprobara la existencia del usuario antes seguir pidiendo datos
    // pensado en la experiencia del usuario sin importar
    // que debo hacer dos llamadas al servidor
    
    // el chequeo de la existencia sera responsabilidad del servidor
    /* try {

        });

        alert('Error comprobando usuario.');

    */
    let username = prompt("Ingrese el nombre de usuario a modificar:");
    
    let newUsernameInput = prompt("Ingrese el nuevo nombre de usuario (enter para dejar igual):");
    let newUsername;
    
    // Si el usuario ingresa null (cancel) o solo espacios, se mantiene el mismo username
    if (newUsernameInput === null || newUsernameInput.trim() === "") {
        newUsername = username;
    } else {
        newUsername = newUsernameInput.trim();
    }
    let newPassword = prompt("Ingrese la nueva contraseña:");
    if (!newPassword) { alert('Contraseña no válida.'); return; }

    // Se calcula el hash SHA-256 de la contraseña antes de enviarla al servidor
    let accesskey = null;
    try {
        accesskey = await this.calcularHashSHA256(newPassword);
    } catch (error) {
        console.error(error);
    }

    let payload = { username, newUsername, accesskey };
    
    try {
        const resp = await fetch('/update-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (resp.status === 200) {
            const j = await resp.json().catch(() => ({}));
            if (j.updated && j.updated > 0) alert('Usuario modificado correctamente.');
            else alert('No se modificó ningún usuario (usuario no encontrado).');
        } else if (resp.status === 404) {
            alert('Usuario no encontrado.');
        } else if (resp.status === 409) {
            alert('Nombre de usuario ya existe.');
        } else {
            const j = await resp.json().catch(() => null);
            alert(j?.message || 'Error al modificar el usuario.');
        }
    } catch (err) {
        console.error(err);
        alert('Error al modificar el usuario.');
    }
}

// -----------------  Codigo de encriptacion sha256 para la contraseña  -----------------
// ----------------- Ejemplo de codigo del profesor ------------------------
// Función para calcular el hash SHA-256 de una cadena
async calcularHashSHA256(cadena)
{
const encoder = new TextEncoder();
const data = encoder.encode(cadena);
const hashBuffer = await crypto.subtle.digest('SHA-256', data);
const hashArray = Array.from(new Uint8Array(hashBuffer));
const hashHex = hashArray.map(byte => byte.toString(16).padStart(2, '0')).join('');
return hashHex;
}
